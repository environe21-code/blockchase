<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>BLOCK CHASE</title>
<style>
html,body{margin:0;height:100%;background:#020617;color:#e2e8f0;font-family:system-ui,sans-serif}
body{display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
h1{font-size:18px;font-weight:900;margin:0 0 10px}
p{font-size:13px;line-height:1.55;color:#94a3b8;margin:0}
a.btn{display:none;margin-top:20px;height:46px;line-height:46px;padding:0 24px;border-radius:12px;border:1px solid #6366f1;background:#4f46e5;color:#fff;font-weight:800;font-size:14px;text-decoration:none}
</style>
</head>
<body>
<div>
<h1>BLOCK CHASE</h1>
<p id="msg">기록을 옮기는 중입니다…<br>Moving your progress…</p>
<a class="btn" id="go" href="#">앱으로 돌아가기 / Return to the app</a>
</div>
<script>
/* 새 앱(Capacitor)이 첫 실행 때 이 페이지를 브라우저 탭으로 연다.
   예전 앱(TWA)의 기록은 이 브라우저의 저장소에 있으므로, 여기서 읽어 같은 기기의 새 앱으로만 넘긴다.
   - 기록은 서버로 보내지 않는다. 기기 안에서 앱 링크(intent, package 지정)로만 전달한다.
   - n(앱이 만든 일회용 값)이 없으면 아무것도 넘기지 않는다. */
(function(){
  var msg=document.getElementById("msg"),go=document.getElementById("go");
  var n="";
  try{n=(new URLSearchParams(location.search).get("n")||"").replace(/[^a-zA-Z0-9]/g,"").slice(0,40)}catch(e){}
  if(!n){msg.innerHTML="이 페이지는 BLOCK CHASE 앱에서 자동으로 열립니다.<br>This page is opened automatically by the BLOCK CHASE app.";return}

  var ok=/^(bc_|bc2_|slide_escape_|blockchase_)/;
  /* 캐시·임시값은 넘기지 않는다(새 앱에서 다시 만들어짐) */
  var skip=/^(bc_stats_cache|bc_gal_rank_v1|bc_home_rank_users_v1|bc2_gal_on_n|bc_stats_q|bc_rank_sent|bc_sim_lock|bc_mig|bc_reward_run|bc_gal_ren)$|^bc2_comm_/;
  /* 중요한 것부터 담는다. 너무 크면 뒤쪽(내가 만든 던전 목록 등)이 빠질 수 있다 */
  var first=["bc2_device_id","bc2_profile","bc_best_moves","slide_escape_unlocked","bc_endless_top10","bc_conquer","bc_first_t","bc_name_asked","bc2_terms_ok","bc2_blocked","bc2_hidden","bc2_pub","bc2_name_registry","blockchase_lang","bc_bgm","slide_escape_muted","slide_escape_theme","slide_escape_seen_v2","bc_tut1_off","bc_champion_60_clear","bc_endless_save"];
  var LIMIT=150000,out={},size=0,has=false,dropped=0;
  function put(k){
    if(Object.prototype.hasOwnProperty.call(out,k))return;
    var v;try{v=localStorage.getItem(k)}catch(e){v=null}
    if(v===null||v===undefined)return;
    var add=(k.length+String(v).length)*1.4+8;
    if(size+add>LIMIT){dropped++;return}
    out[k]=String(v);size+=add;
  }
  try{
    for(var i=0;i<first.length;i++)put(first[i]);
    var rest=[];
    for(var j=0;j<localStorage.length;j++){var k=localStorage.key(j);if(k&&ok.test(k)&&!skip.test(k))rest.push(k)}
    rest.sort(function(a,b){return (String(localStorage.getItem(a)||"").length)-(String(localStorage.getItem(b)||"").length)});
    for(var r=0;r<rest.length;r++)put(rest[r]);
  }catch(e){}
  has=!!(out.bc2_device_id||out.bc_best_moves||out.bc2_profile||out.slide_escape_unlocked||out.bc_endless_top10);

  function b64url(s){
    var bytes=new TextEncoder().encode(s),bin="";
    for(var i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));
    return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  }
  var d="none";
  if(has){try{d=b64url(JSON.stringify(out))}catch(e){d="none"}}
  var target="intent://migrate?n="+n+"&x="+dropped+"&d="+d+"#Intent;scheme=bcmigrate;package=io.github.environe21_code.blockchase;end";
  go.href=target;
  msg.innerHTML=has?"기록을 찾았습니다. 앱으로 돌아갑니다…<br>Progress found. Returning to the app…":"옮길 기록이 없습니다. 앱으로 돌아갑니다…<br>No saved progress. Returning to the app…";
  /* 자동 이동이 브라우저에 막히면 버튼으로 돌아간다 */
  setTimeout(function(){try{location.href=target}catch(e){}},350);
  setTimeout(function(){go.style.display="inline-block"},1500);
})();
</script>
</body>
</html>
